<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--night:#0b0510;--plum:#1c0b29;--vio:#3d1760;--rose:#ff7aa8;--mag:#d92b8c;--amb:#ff9d5c;--cream:#f8ebe4;--mu:#b7a0c2;--line:rgba(255,160,200,.22);--ease:cubic-bezier(.22,.8,.3,1);--disp:'Fraunces',Georgia,serif;--font:'Nunito','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;font-family:var(--font)}
html,body{height:100%;background:var(--night);color:var(--cream);overflow:hidden}
body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bg::before{content:"";position:absolute;left:-25%;right:-25%;bottom:-40%;height:78%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,140,90,.5),rgba(217,43,140,.3) 55%,transparent);animation:rise 14s ease-in-out infinite alternate}

.top{padding:18px 24px 4px;display:flex;align-items:baseline;justify-content:space-between}
.logo{font-family:var(--disp);font-style:italic;font-weight:600;font-size:30px;letter-spacing:.01em}
.logo::after{content:"✦";color:var(--amb);font-size:13px;margin-left:4px;vertical-align:super;font-style:normal}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;padding:8px 20px 12px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .45s var(--ease),transform .45s var(--ease);overflow-y:auto}

h2{font-family:var(--disp);font-size:26px;font-weight:600;margin:8px 0 16px}

.meta{padding:18px 12px 0;text-align:center}

.bio{color:#e6d3ea;font-size:15px;margin:6px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tags span{font-size:12.5px;padding:3px 12px;border-radius:99px;border:1px solid var(--line);color:#ffc9dc}
.mt{margin-top:12px;font-size:13px;color:var(--amb)}

.stamp.l{left:24px;color:var(--rose);border:2px solid var(--rose);transform:rotate(-10deg)}

.acts{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:20px}
.rb{width:56px;height:56px;border-radius:50%;font-size:22px;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:transform .25s var(--ease),box-shadow .25s}
.rb.hl{width:68px;height:68px;font-size:28px;border:0;background:linear-gradient(135deg,var(--amb),var(--rose) 55%,var(--mag));box-shadow:0 12px 30px -10px var(--mag)}

.av>.pf{border-radius:50%;background:#000}.av .pf svg,.av .pf img{filter:blur(calc(var(--bl)*.4))}

.row .m{flex:1;min-width:0}.row .m strong{display:block;font-family:var(--disp);font-size:18px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--amb);box-shadow:0 0 10px var(--amb);animation:pulse 1.8s infinite}

.sk{height:68px;border-radius:24px;margin-bottom:10px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%) 0 0/200% 100%;animation:sh 1.3s linear infinite}

.chat.on{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .4s}
.ch{display:flex;align-items:center;gap:12px;padding:10px 16px}
.ch .back{font-size:26px;padding:4px 10px}
.ch .av{width:48px;height:48px}
.ch .t{flex:1}.ch .t strong{display:block;font-family:var(--disp);font-size:19px;line-height:1.2}.ch .t small{color:var(--mu);font-size:12px}
.prog{height:1px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--amb));transition:width .8s var(--ease)}

.b{max-width:80%;padding:10px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .4s var(--ease) both}
.b.u{align-self:flex-end;margin-left:auto;background:linear-gradient(135deg,#ffc48f,#ff8fb4);color:#2a0716;border-bottom-right-radius:6px;transform-origin:100% 100%;box-shadow:0 6px 16px -8px var(--amb)}
.b:not(.u):not(.sys){align-self:flex-start;margin-right:auto;background:#2c1545;color:var(--cream);border:1px solid rgba(190,140,255,.22);border-bottom-left-radius:6px;transform-origin:0 100%}
.b.sys{align-self:center;max-width:90%;background:none;border:1px dashed rgba(255,157,92,.5);color:var(--amb);font-size:13px;border-radius:99px;text-align:center}

.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:bn 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.comp{display:flex;align-items:flex-end;gap:10px;padding:10px 14px 14px}

.comp textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,122,168,.18)}
.send{width:46px;height:46px;border-radius:50%;flex:none;font-size:18px;color:#2a0716;background:linear-gradient(135deg,var(--amb),var(--rose));transition:transform .25s var(--ease),opacity .3s,filter .3s}

.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(11,5,16,.8);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.modal.on{opacity:1;visibility:visible;transition:opacity .4s}
.mbox{text-align:center;transform:scale(.85);transition:transform .6s var(--ease)}.modal.on .mbox{transform:none}
.mbox h2{font-size:34px;font-style:italic;color:var(--rose);margin:22px 0 6px}
.pair{display:flex;justify-content:center}.pair .av{width:104px;height:104px;padding:4px}.pair .av+.av{margin-left:-20px}
.mbox .btn{display:block;margin:12px auto 0;min-width:230px}.mbox .note{margin-bottom:14px}
.pt{position:fixed;left:0;top:0;z-index:40;pointer-events:none;font-size:18px;will-change:transform,opacity}
.heart{position:fixed;left:50%;top:42%;z-index:35;font-size:96px;pointer-events:none;transform:translate(-50%,-50%);animation:hp .9s var(--ease) forwards;filter:drop-shadow(0 0 24px var(--mag))}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:90px;z-index:70;transform:translate(-50%,20px);padding:10px 20px;border-radius:99px;background:rgba(28,11,41,.95);border:1px solid var(--line);opacity:0;transition:.5s var(--ease);pointer-events:none;font-size:14px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.glow{animation:glow 1.6s var(--ease)}
@keyframes glow{40%{box-shadow:0 0 0 10px rgba(255,157,92,.35),0 0 40px var(--amb)}}
.onb{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 24px;background:linear-gradient(180deg,#0b0510,#1c0b29 70%,#33103a);overflow-y:auto}
.onb.on{display:flex}
.obar{height:3px;border-radius:3px;background:rgba(255,255,255,.1);margin-bottom:34px;flex:none}.obar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--amb));border-radius:3px;transition:width .6s var(--ease)}
.step{animation:cardIn .6s var(--ease) both;display:flex;flex-direction:column;gap:12px;flex:1}.step.na{animation:none}
.oq{font-family:var(--disp);font-size:28px;line-height:1.2;font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px}.opts.g{flex-direction:row;flex-wrap:wrap}
.opt{padding:14px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;font-size:16px;transition:all .25s var(--ease)}
.opt:hover{border-color:var(--rose);transform:translateX(3px)}
.opt.sel{background:linear-gradient(135deg,rgba(255,122,168,.28),rgba(217,43,140,.28));border-color:var(--rose)}
.opt.sm{padding:8px 15px;border-radius:99px;font-size:14px}.opt.sm:hover{transform:none}
.inp{padding:14px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream);font-size:17px;outline:0}.inp:focus{border-color:var(--rose)}
.nx{display:flex;gap:10px;margin-top:auto;padding-top:18px}.nx .btn{flex:1}
.big{font-size:64px;text-align:center}
.ibox{padding:14px 16px;border-radius:18px;border:1px solid rgba(255,157,92,.4);background:rgba(255,157,92,.08);color:#ffd9bd;font-size:14px;animation:cardIn .5s var(--ease) both}
.pcard{text-align:center;padding:10px 0 20px}.pcard .mono{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;font-size:40px}
.pcard h3{font-family:var(--disp);font-size:28px}.pty{color:var(--amb);margin:4px 0}.pcard .tags{margin-top:12px}
.setr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);margin-bottom:12px}.setr small{display:block;color:var(--mu)}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:background .3s;flex:none}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}.sw.on{background:linear-gradient(135deg,var(--rose),var(--mag))}.sw.on i{transform:translateX(20px)}
.pb{display:flex;gap:10px;margin:16px 0}.pb .btn{flex:1;font-size:14px;padding:12px 10px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="bg" id="bg"></div>
<div id="app">
<header class="top"><span class="logo">blindly</span><span class="sub">erst reden, dann sehen</span></header>
<main>
<section class="view on" id="v-disc"><div class="stack" id="stack"></div>

</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const id=CID,c=S.chats[id],before=lvl(id);learn(c,t);hdr();if(before<1&&lvl(id)>=1)unlock(id);
sending=false;ta.focus();schedule(id,null,0,t)}
sb.onclick=sendMsg;ta.oninput=()=>{fit();upd()};
ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
function unlock(id){const a=$('#cav');a.classList.add('glow');setTimeout(()=>a.classList.remove('glow'),1700);const r=a.getBoundingClientRect();burst(r.x+r.width/2,r.y+r.height/2,30);toast('Profilbild freigeschaltet ✨')}
function learn(c,t){const l=t.toLowerCase();for(const k in HOB)if(HOB[k].test(l)&&!c.mem.h.includes(k))c.mem.h.push(k)}
/* Bot-Logik */
function pickNew(c,arr){const f=arr.filter(x=>!c.used.includes(x));const p=rnd(f.length?f:arr);c.used.push(p);if(c.used.length>70)c.used.shift();return p}
function compose(id,forced,text){const c=S.chats[id],B=BK[id],b=bot(id),l=(text||'').toLowerCase(),me=S.me||{hobbies:[]};
const lastB=[...c.m].reverse().find(x=>x.r==='b'),asked=lastB&&/\?\s*\S{0,3}$/.test(lastB.t);let tp=forced,hb=null,hw=null;
if(!tp){for(const [k,re] of TOP)if(re.test(l)){tp=k;break}
for(const k in HOB){const mm=l.match(HOB[k]);if(mm){hb=k;hw=mm[0][0].toUpperCase()+mm[0].slice(1);if(!tp||['day','joke','greet'].includes(tp))tp='hobby';break}}
if(!tp&&asked&&l.length>3&&!/\?/.test(l))tp='ack';
if(!tp&&/\?\s*$|und du|bei dir/.test(l))tp='story';
if(!tp)tp=l.length<12&&Math.random()<.5?'short':rnd(['fb','story','fb'])}
let out;
if(tp==='about')out=`Ich bin ${b.a} und ${b.job}. ${b.fun}`;
else if(tp==='short')out=pickNew(c,SH);
else if(tp==='ack'){const w=(l.match(/[a-zäöüß]{5,}/g)||[]).find(x=>!STOP.test(x));out=w?pickNew(c,ACK).replace('{w}',w[0].toUpperCase()+w.slice(1))+PS[id]:pickNew(c,B.fb)}
else out=pickNew(c,B[tp]);
const h=hw||rnd(c.mem.h.length?c.mem.h:me.hobbies.length?me.hobbies:['das']);out=out.replace(/\{h\}/g,h);
if(tp==='hobby'&&hb&&Math.random()<.7)out+=' '+pickNew(c,HS[hb]);
if(tp==='greet'&&forced){if(me.name)out+=` Schön, dich kennenzulernen, ${me.name}.`;if(me.hobbies.length)out+=` In deinem Steckbrief steht ${rnd(me.hobbies)}, das macht mich neugierig.`}
if(S.astro&&me.sign&&!c.as&&c.m.length>6&&Math.random()<.25){c.as=1;out+=` Übrigens, du bist ${me.sign}, oder? Ich bin ${b.sg}. Glaubst du, das passt?`}
else if(tp!=='hobby'&&tp!=='greet'&&c.mem.h.length&&c.m.length-(c.cb||0)>10&&Math.random()<.25){c.cb=c.m.length;out+=' '+CB[id].replace(/\{h\}/g,rnd(c.mem.h))}
else if(!/\?/.test(out)&&tp!=='short'&&!asked&&c.m.length>3&&Math.random()<.25)out+=' '+pickNew(c,QS);
const parts=[out];if(out.length>120&&Math.random()<.4){const m=out.slice(40).search(/[.!?] /);if(m>-1){const k=40+m+1;parts.splice(0,1,out.slice(0,k),out.slice(k+1))}}return parts}
async function aiReply(id,forced){const c=S.chats[id],me=S.me||{};
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(22000),body:JSON.stringify({bot:id,mode:forced==='greet'?'greet':forced?'idle':'reply',me:{name:me.name,age:me.age,per:me.per,hobbies:me.hobbies,sign:S.astro?me.sign:null},msgs:c.m.slice(-24).map(x=>({r:x.r,t:x.t}))})});
if(!r.ok)throw 0;const d=await r.json();return d.parts&&d.parts.length?d.parts:null}
function schedule(id,forced,delay,text){clearTimeout(timers[id]);clearTimeout(timers[id+'i']);const tk=timers[id+'t']=(timers[id+'t']||0)+1;
timers[id]=setTimeout(async()=>{if(id===CID)typing(true);let parts=null,t0=Date.now();try{parts=await aiReply(id,forced)}catch(e){}
if(tk!==timers[id+'t'])return;if(!parts){parts=compose(id,forced,text);await new Promise(r=>setTimeout(r,Math.max(0,700-(Date.now()-t0))))}deliver(id,parts,0)},delay||(400+Math.random()*700))}
function deliver(id,parts,i){timers[id]=setTimeout(()=>{if(id===CID)typing(false);add(id,'b',parts[i]);if(id!==CID&&i===0)toast(bot(id).n+' hat dir geschrieben');
if(i+1<parts.length){if(id===CID)typing(true);deliver(id,parts,i+1)}else idleTimer(id)},i===0?250:Math.min(3000,500+parts[i].length*20))}
function typing(on){const o=$('#ty');if(o)o.remove();if(on){const d=document.createElement('div');d.id='ty';d.className='b b typing';d.innerHTML='<i></i><i></i><i></i>';box.appendChild(d);box.scrollTop=box.scrollHeight}}
function idleTimer(id){clearTimeout(timers[id+'i']);timers[id+'i']=setTimeout(()=>{const c=S.chats[id];const last=c.m[c.m.length-1];if(last&&last.r==='b'&&!c.idled&&c.m.length>1){c.idled=1;schedule(id,'story',200)}},45000)}
/* Onboarding und Profil */
let Q={i:0,a:{}};
function renderOnb(anim=true){const o=$('#onb'),n=STEPS.length,i=Q.i,a=Q.a;o.classList.add('on');let h=`<div class="obar"><i style="width:${i/n*100}%"></i></div>`;
if(i===n){const t=TYPES[a.per??1];h+=`<div class="step" style="text-align:center"><div class="big">${t[1]}</div><h2>${t[0]}</h2><p class="note">${t[2]}</p><p class="note">Wir suchen jetzt Profile, die zu dir passen könnten.</p><div class="nx"><button class="btn" id="fin">Profile entdecken</button></div></div>`}
else{const s=STEPS[i];h+=`<div class="step${anim?'':' na'}"><p class="oq">${s.q}</p>`;
if(s.t==='text')h+=`<input id="in-n" class="inp" placeholder="Dein Vorname" maxlength="20" value="${esc(a.name||'')}"><input id="in-a" class="inp" inputmode="numeric" placeholder="Dein Alter" maxlength="2" value="${a.age||''}"><p class="note" id="err"></p>`;
else if(s.t==='astro'){h+=`<div class="opts"><button class="opt${a.astro===true?' sel':''}" data-j="0">Ja, ein bisschen Magie darf sein</button><button class="opt${a.astro===false?' sel':''}" data-j="1">Nein, eher nicht</button></div>`;
if(a.astro)h+=`<div class="ibox">✦ Wenn du Sternzeichen aktivierst, passen sich die vorgeschlagenen Personen an dein Sternzeichen an.</div><div class="opts g">${SIGNS.map(x=>`<button class="opt sm${a.sign===x?' sel':''}" data-sg="${x}">${x}</button>`).join('')}</div>`}
else if(s.t==='multi')h+=`<div class="opts g">${s.o.map(x=>`<button class="opt sm${(a[s.k]||[]).includes(x)?' sel':''}" data-j="${x}">${x}</button>`).join('')}</div>`;
else h+=`<div class="opts">${s.o.map((x,j)=>`<button class="opt${a[s.k]===j?' sel':''}" data-j="${j}">${x}</button>`).join('')}</div>`;
h+=`<div class="nx">${i?'<button class="btn ghost" id="pv">Zurück</button>':''}<button class="btn" id="nx">Weiter</button></div></div>`}
o.innerHTML=h;
$$('#onb .opt').forEach(b=>b.onclick=()=>{const s=STEPS[Q.i];
if(b.dataset.sg){a.sign=b.dataset.sg;return renderOnb(false)}
if(s.t==='multi'){const l=a[s.k]=a[s.k]||[],p=l.indexOf(b.dataset.j);p<0?l.push(b.dataset.j):l.splice(p,1);b.classList.toggle('sel')}
else if(s.t==='astro'){a.astro=b.dataset.j==='0';renderOnb(false)}
else{a[s.k]=+b.dataset.j;$$('#onb .opt').forEach(x=>x.classList.toggle('sel',x===b))}});
if($('#pv'))$('#pv').onclick=()=>{Q.i--;renderOnb()};
if($('#nx'))$('#nx').onclick=()=>{const s=STEPS[Q.i];
if(s.t==='text'){const nm=$('#in-n').value.trim(),g=parseInt($('#in-a').value,10);a.name=nm;a.age=g;if(!nm){$('#err').textContent='Bitte gib einen Namen ein.';return}if(!(g>=18&&g<100)){$('#err').textContent='Blindly ist erst ab 18. Bitte gib dein Alter an.';return}}
else if(s.t==='multi'){if(!(a[s.k]||[]).length)return toast('Wähle mindestens ein Hobby')}
else if(s.t==='astro'){if(a.astro===undefined)return toast('Bitte wähle eine Antwort');if(a.astro&&!a.sign)return toast('Wähle dein Sternzeichen')}
else if(a[s.k]===undefined)return toast('Bitte wähle eine Antwort');
Q.i++;renderOnb()};
if($('#fin'))$('#fin').onclick=()=>{S.me={name:a.name,age:a.age,per:a.per??1,hobbies:a.hob||[],goal:a.goal,we:a.we,nt:a.nt,sign:a.sign||null};S.astro=!!a.astro;save();o.classList.remove('on');renderStack();renderProfile();toast('Willkommen, '+a.name)}}
function renderProfile(){const m=S.me;if(!m)return;const t=TYPES[m.per];
$('#prof').innerHTML=`<div class="pcard"><div class="mono">${esc(m.name[0].toUpperCase())}</div><h3>${esc(m.name)}, ${m.age}</h3><p class="pty">${t[1]} ${t[0]}</p><p class="note">${t[2]}</p><div class="tags">${m.hobbies.map(h=>`<span>${h}</span>`).join('')}</div></div>
<div class="setr"><div><strong>Sternzeichen-Matching</strong><small>${m.sign||'Kein Sternzeichen gewählt'}</small></div><button class="sw${S.astro?' on':''}" id="swa" aria-label="Sternzeichen-Matching umschalten"><i></i></button></div>
<div class="ibox">✦ Wenn aktiviert, passen sich die vorgeschlagenen Personen an dein Sternzeichen an.</div>
<div class="pb"><button class="btn ghost" id="rq">Quiz wiederholen</button><button class="btn ghost" id="rs">Alles zurücksetzen</button></div>
<p class="note">Alle Profile und Nachrichten in Blindly sind simulierte Demo-Inhalte. Die Personen sind Chatbots, keine echten Menschen. Alles bleibt lokal in deinem Browser gespeichert.</p>`;
$('#swa').onclick=()=>{S.astro=!S.astro;save();toast(S.astro?'Vorschläge angepasst ✦':'Sternzeichen-Matching aus');renderStack();renderProfile()};
$('#rq').onclick=()=>{Q={i:0,a:{}};renderOnb()};
$('#rs').onclick=()=>{S={me:null,astro:false,dec:{},chats:{}};save();Q={i:0,a:{}};renderOnb();renderStack();renderList();$('#prof').innerHTML=''}}
function stars(){const b=$('#bg');for(let i=0;i<46;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;--d:${2+Math.random()*4}s;animation-delay:${-Math.random()*5}s;transform:scale(${.5+Math.random()})`;b.appendChild(s)}}
stars();skeleton();$('#stack').innerHTML='<div class="sk" style="height:100%;border-radius:36px"></div>';
if(!S.me){Q={i:0,a:{}};renderOnb()}else renderProfile();
setTimeout(()=>{renderStack();renderList()},red?0:900);
</script></body></html>
